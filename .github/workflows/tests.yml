name: WebRTC TESTS

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        php: ["8.2", "8.3", "8.4", "8.5"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          # The media-flow tests exercise the AVCodec FFI bindings.
          extensions: ffi
          ini-values: ffi.enable=true

      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Configure Linux network (multicast, IPv6, rp_filter)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo ip link set lo multicast on
          sudo ip route replace 224.0.0.0/4 dev lo || true
          sudo sysctl -w net.ipv4.conf.all.rp_filter=0
          sudo sysctl -w net.ipv4.conf.default.rp_filter=0
          sudo sysctl -w net.ipv4.conf.lo.rp_filter=0
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=0
          sudo ip -6 addr add fd00:1:2:3::1/128 dev lo || true

      - name: Configure macOS network (multicast, IPv6, firewall)
        if: matrix.os == 'macos-latest'
        run: |
          sudo ifconfig lo0 multicast || true
          sudo route -n add -net 224.0.0.0/4 -interface lo0 || true
          sudo ifconfig lo0 inet6 fd00:1:2:3::1/128 alias || true
          sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off || true

      - name: Configure Windows network (firewall, weak host, IPv6)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False
          Get-NetIPInterface | ForEach-Object {
            Set-NetIPInterface -InterfaceIndex $_.InterfaceIndex `
              -WeakHostSend Enabled -WeakHostReceive Enabled -ErrorAction SilentlyContinue
          }
          netsh interface ipv6 add address "Loopback Pseudo-Interface 1" fd00:1:2:3::1

      - name: Run Psalm
        run: vendor/bin/psalm --no-progress

      - name: Cache FFmpeg 9.0.1 build
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/ffmpeg-9.0.1
          key: ffmpeg-9.0.1-${{ runner.os }}-${{ runner.arch }}

      - name: Install FFmpeg runtime libraries (Ubuntu)
        # The cached FFmpeg prefix is linked against these Ubuntu packages.
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx264-dev libx265-dev libvpx-dev libfdk-aac-dev \
            libmp3lame-dev libopus-dev zlib1g-dev

      - name: Install FFmpeg 9.0.1 on Linux
        if: matrix.os == 'ubuntu-latest' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y \
            autoconf automake build-essential cmake git libtool \
            pkg-config texinfo nasm

          git clone --depth 1 --branch n9.0.1 https://github.com/FFmpeg/FFmpeg.git
          cd FFmpeg
          ./configure --prefix="$RUNNER_TOOL_CACHE/ffmpeg-9.0.1" \
            --enable-shared --enable-gpl --enable-nonfree \
            --enable-libx264 --enable-libx265 --enable-libvpx \
            --enable-libfdk-aac --enable-libmp3lame --enable-libopus
          make -j$(nproc)
          make install

      - name: Install FFmpeg 9.0.1 on macOS
        if: matrix.os == 'macos-latest' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          brew install nasm pkg-config x264 x265 libvpx fdk-aac lame opus
          git clone --depth 1 --branch n9.0.1 https://github.com/FFmpeg/FFmpeg.git
          cd FFmpeg
          BREW_PREFIX="$(brew --prefix)"
          export PKG_CONFIG_PATH="$BREW_PREFIX/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          # lame (libmp3lame) ships no pkg-config .pc file, so FFmpeg's configure probes it
          # with the bare compiler. On macOS the Homebrew prefix is not a default search path,
          # so lame/lame.h and -lmp3lame are invisible without these flags and configure fails
          # with "ERROR: libmp3lame >= 3.98.3 not found". The .pc-shipping codecs are already
          # found via PKG_CONFIG_PATH above.
          ./configure --prefix="$RUNNER_TOOL_CACHE/ffmpeg-9.0.1" \
            --enable-shared --enable-gpl --enable-nonfree \
            --extra-cflags="-I$BREW_PREFIX/include" \
            --extra-ldflags="-L$BREW_PREFIX/lib" \
            --enable-libx264 --enable-libx265 --enable-libvpx \
            --enable-libfdk-aac --enable-libmp3lame --enable-libopus
          make -j$(sysctl -n hw.logicalcpu)
          make install

      - name: Install Homebrew FFmpeg runtime deps on macOS
        # Cached dylibs still need the Homebrew codec libs they were linked against.
        if: matrix.os == 'macos-latest'
        run: brew install x264 x265 libvpx fdk-aac lame opus

      - name: Install FFmpeg 9 shared libraries on Windows
        if: matrix.os == 'windows-latest' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $prefix = "$env:RUNNER_TOOL_CACHE\ffmpeg-9.0.1"
          New-Item -ItemType Directory -Force -Path $prefix | Out-Null
          $zip = "$env:RUNNER_TEMP\ffmpeg-win64-shared.zip"
          # BtbN n9.0 shared GPL build. The -latest alias tracks the 9.0 release branch.
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\ffmpeg-extract" -Force
          $root = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg-extract" -Directory | Select-Object -First 1
          Copy-Item -Path "$($root.FullName)\*" -Destination $prefix -Recurse -Force

      - name: Verify FFmpeg 9 libraries
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)
              FFMPEG_PREFIX="$RUNNER_TOOL_CACHE/ffmpeg-9.0.1"
              ls -l "$FFMPEG_PREFIX/lib"/libavcodec.so* "$FFMPEG_PREFIX/lib"/libavformat.so* "$FFMPEG_PREFIX/lib"/libavfilter.so*
              test -e "$FFMPEG_PREFIX/lib/libavcodec.so"
              LD_LIBRARY_PATH="$FFMPEG_PREFIX/lib:${LD_LIBRARY_PATH:-}" ldd "$FFMPEG_PREFIX/lib/libavcodec.so"
              ;;
            macOS)
              FFMPEG_PREFIX="$RUNNER_TOOL_CACHE/ffmpeg-9.0.1"
              ls -l "$FFMPEG_PREFIX/lib"/libavcodec*.dylib "$FFMPEG_PREFIX/lib"/libavformat*.dylib "$FFMPEG_PREFIX/lib"/libavfilter*.dylib
              test -e "$FFMPEG_PREFIX/lib/libavcodec.dylib"
              ;;
            Windows)
              FFMPEG_PREFIX="$RUNNER_TOOL_CACHE/ffmpeg-9.0.1"
              ls -l "$FFMPEG_PREFIX/bin"/avcodec-*.dll "$FFMPEG_PREFIX/bin"/avformat-*.dll "$FFMPEG_PREFIX/bin"/avfilter-*.dll
              ;;
          esac

      - name: Expose FFmpeg DLLs to PHP (Windows)
        # PHP's FFI loads avcodec by its full path, but Windows then resolves that DLL's own
        # dependencies (avutil-61.dll, swresample-7.dll, ...) through the default search order,
        # which does NOT include the loaded DLL's own directory and does not reliably honour
        # PATH for a native child process launched from Git bash. The result is
        # "Failed loading avcodec-63.dll (The specified module could not be found)" even though
        # every sibling DLL is present. The executable's own directory is always searched first,
        # so drop the FFmpeg DLLs next to php.exe.
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          FFMPEG_PREFIX="$RUNNER_TOOL_CACHE/ffmpeg-9.0.1"
          PHP_DIR="$(dirname "$(which php)")"
          echo "Copying FFmpeg DLLs into $PHP_DIR"
          cp "$FFMPEG_PREFIX/bin/"*.dll "$PHP_DIR/"
          ls "$PHP_DIR"/avcodec-*.dll "$PHP_DIR"/avutil-*.dll

      - name: Diagnose AVCodec FFI availability
        shell: bash
        run: |
          FFMPEG_PREFIX="$RUNNER_TOOL_CACHE/ffmpeg-9.0.1"
          case "$RUNNER_OS" in
            Linux)
              export LD_LIBRARY_PATH="$FFMPEG_PREFIX/lib:${LD_LIBRARY_PATH:-}"
              export LIB_AVCODEC_PATH="$FFMPEG_PREFIX/lib/libavcodec.so"
              export LIB_AVFORMAT_PATH="$FFMPEG_PREFIX/lib/libavformat.so"
              export LIB_AVFILTER_PATH="$FFMPEG_PREFIX/lib/libavfilter.so"
              ;;
            macOS)
              export DYLD_LIBRARY_PATH="$FFMPEG_PREFIX/lib:${DYLD_LIBRARY_PATH:-}"
              export LIB_AVCODEC_PATH="$FFMPEG_PREFIX/lib/libavcodec.dylib"
              export LIB_AVFORMAT_PATH="$FFMPEG_PREFIX/lib/libavformat.dylib"
              export LIB_AVFILTER_PATH="$FFMPEG_PREFIX/lib/libavfilter.dylib"
              ;;
            Windows)
              export PATH="$FFMPEG_PREFIX/bin:$PATH"
              export LIB_AVCODEC_PATH="$(ls "$FFMPEG_PREFIX/bin"/avcodec-*.dll | head -1)"
              export LIB_AVFORMAT_PATH="$(ls "$FFMPEG_PREFIX/bin"/avformat-*.dll | head -1)"
              export LIB_AVFILTER_PATH="$(ls "$FFMPEG_PREFIX/bin"/avfilter-*.dll | head -1)"
              ;;
          esac
          echo "LIB_AVCODEC_PATH=$LIB_AVCODEC_PATH"
          php -r '
            require "vendor/autoload.php";
            echo "FFI loaded: " . (extension_loaded("FFI") ? "yes" : "no") . "\n";
            foreach (["AVCodec", "AVFormat", "AVFilter"] as $c) {
              $fqcn = "Webrtc\\AVCodec\\$c";
              try { $fqcn::init(); echo "$c: OK\n"; }
              catch (\Throwable $e) { echo "$c: " . get_class($e) . ": " . $e->getMessage() . "\n"; }
            }
            echo "isAvailable: " . (\Webrtc\AVCodec\AVCodec::isAvailable() ? "true" : "false") . "\n";
          ' || true

      - name: Run PHPUnit tests
        shell: bash
        run: |
          FFMPEG_PREFIX="$RUNNER_TOOL_CACHE/ffmpeg-9.0.1"
          case "$RUNNER_OS" in
            Linux)
              export LD_LIBRARY_PATH="$FFMPEG_PREFIX/lib:${LD_LIBRARY_PATH:-}"
              export LIB_AVCODEC_PATH="$FFMPEG_PREFIX/lib/libavcodec.so"
              export LIB_AVFORMAT_PATH="$FFMPEG_PREFIX/lib/libavformat.so"
              export LIB_AVFILTER_PATH="$FFMPEG_PREFIX/lib/libavfilter.so"
              ;;
            macOS)
              export DYLD_LIBRARY_PATH="$FFMPEG_PREFIX/lib:${DYLD_LIBRARY_PATH:-}"
              export LIB_AVCODEC_PATH="$FFMPEG_PREFIX/lib/libavcodec.dylib"
              export LIB_AVFORMAT_PATH="$FFMPEG_PREFIX/lib/libavformat.dylib"
              export LIB_AVFILTER_PATH="$FFMPEG_PREFIX/lib/libavfilter.dylib"
              ;;
            Windows)
              FFMPEG_PREFIX_WIN="$(cygpath -u "$FFMPEG_PREFIX" 2>/dev/null || echo "$FFMPEG_PREFIX")"
              export PATH="$FFMPEG_PREFIX/bin:$PATH"
              codec_dll="$(ls "$FFMPEG_PREFIX/bin"/avcodec-*.dll | head -1)"
              format_dll="$(ls "$FFMPEG_PREFIX/bin"/avformat-*.dll | head -1)"
              filter_dll="$(ls "$FFMPEG_PREFIX/bin"/avfilter-*.dll | head -1)"
              export LIB_AVCODEC_PATH="$codec_dll"
              export LIB_AVFORMAT_PATH="$format_dll"
              export LIB_AVFILTER_PATH="$filter_dll"
              ;;
          esac
          vendor/bin/phpunit
